version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - misspell
    - unconvert
  exclusions:
    paths:
      - internal/platform/platformdb # sqlc generated
      - internal/modules/.*/db # sqlc generated
    rules:
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
