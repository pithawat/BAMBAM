# Local development database only. UAT/production get DATABASE_URL from the deploy platform.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bambam
      POSTGRES_PASSWORD: bambam
      POSTGRES_DB: bambam
    ports:
      - "5433:5432"   # host 5433: a local Windows PostgreSQL often owns 5432
    volumes:
      - bambam-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambam -d bambam"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bambam-db:
