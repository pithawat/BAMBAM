name: CI

# lint + typecheck + test on every push and PR. Deploy is not set up yet
# (deploy platform unknown — docs/shared/00-platform.md Open issues).
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: sqlc generated code is up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend
      - run: go build ./...
      - run: go test ./... -race

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bambam
          POSTGRES_PASSWORD: bambam
          POSTGRES_DB: bambam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bambam -d bambam" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: development
      GIN_MODE: release
      DATABASE_URL: postgres://bambam:bambam@localhost:5432/bambam?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      ROLE_SWITCHER_ENABLED: "true"
      APP_SESSION_TTL: 1h
      SSO_ISSUER: https://rmc-sso.cipcloud.net
      SSO_AUTHORIZE_URL: https://rmc-sso.cipcloud.net/api/auth/oauth2/authorize
      SSO_TOKEN_URL: https://rmc-sso.cipcloud.net/api/auth/oauth2/token
      SSO_USERINFO_URL: https://rmc-sso.cipcloud.net/api/auth/oauth2/userinfo
      SSO_END_SESSION_URL: https://rmc-sso.cipcloud.net/api/auth/oauth2/endsession
      SSO_CLIENT_ID: bam
      SSO_REDIRECT_URI: http://localhost:3000/api/auth/callback/rmc-sso
      SSO_POST_LOGOUT_REDIRECT_URI: http://localhost:3000/signed-out
      # CI never talks to RMC SSO: dummy values that only satisfy config validation
      SSO_CLIENT_SECRET: ci-dummy-client-secret-not-used
      APP_SESSION_SECRET: ci-dummy-session-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: migrate
        working-directory: backend
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.29.0 -dir db/migrations postgres "$DATABASE_URL" up
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
